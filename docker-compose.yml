services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: watchdog-mqtt
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./sim/broker:/mosquitto/config
    restart: unless-stopped

  mosquitto-decoy:
    image: eclipse-mosquitto:2
    container_name: watchdog-mqtt-decoy
    ports:
      - "127.0.0.1:1885:1883"
    volumes:
      - ./sim/broker/decoy.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped
