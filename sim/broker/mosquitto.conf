# Aegis Watchdog isolated local-lab broker.
# Host exposure is restricted separately to 127.0.0.1 by docker-compose.yml.
listener 1883 0.0.0.0
protocol mqtt

allow_anonymous false
password_file /tmp/watchdog-mosquitto/passwd
acl_file /tmp/watchdog-mosquitto/acl

persistence false
connection_messages true
log_dest stdout
log_timestamp true
log_type error
log_type warning
log_type notice
log_type information

set_tcp_nodelay true
